<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍬 Sweet Candy Match 🍭</title>
    <style>
        :root {
            --board-size: 8;
            --cell-size: 45px;
            --gap: 2px;
            --board-padding: 8px;
            --bg-blur: 70px;
            --anim-fast: 120ms;
            --anim-mid: 180ms;
            --anim-slow: 280ms;
        }

        @media (max-width: 420px) {
            :root {
                --cell-size: calc((100vw - 40px - var(--board-padding) * 2 - var(--gap) * (var(--board-size) - 1)) / var(--board-size));
                --bg-blur: 24px;
            }
        }

        * { box-sizing: border-box; }

        body {
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 45%, #c8a2c8 100%);
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 20px 10px; min-height: 100vh;
            touch-action: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; position: relative;
        }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(var(--bg-blur)); z-index: 0; pointer-events: none;
            animation: float 9s ease-in-out infinite;
        }
        body::before {
            width: 360px; height: 360px;
            background: radial-gradient(circle, rgba(255, 138, 128, 0.65), transparent 70%);
            top: -100px; left: -100px;
        }
        body::after {
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(170, 0, 255, 0.45), transparent 70%);
            bottom: -100px; right: -100px; animation-delay: -2s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -20px); }
        }

        /* HUD Styles */
        .hud {
            display: flex; justify-content: space-between; gap: 8px;
            width: 100%; max-width: 400px; margin-bottom: 20px;
            color: white; z-index: 10;
        }
        .hud-box {
            flex: 1;
            background: linear-gradient(135deg, #ff6491, #d81b60);
            padding: 8px 12px; border-radius: 20px; text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
            display: flex; flex-direction: column; justify-content: center;
        }
        .hud-box label { font-size: 11px; opacity: 0.9; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .hud-box span { font-size: 20px; font-weight: bold; transition: transform var(--anim-fast); display: inline-block; }
        .hud-box span.bump { transform: scale(1.3); }

        .game-container { position: relative; z-index: 5; }

        .grid {
            display: grid;
            grid-template-columns: repeat(var(--board-size), var(--cell-size));
            grid-template-rows: repeat(var(--board-size), var(--cell-size));
            gap: var(--gap);
            background: rgba(255, 255, 255, 0.22);
            padding: var(--board-padding); border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 24px 60px rgba(216, 27, 96, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(var(--bg-blur));
        }

        .candy {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; position: relative;
            box-shadow: inset -5px -5px 12px rgba(0, 0, 0, 0.22),
                        inset 5px 5px 12px rgba(255, 255, 255, 0.75),
                        0 4px 8px rgba(0, 0, 0, 0.18);
            will-change: transform, opacity;
            transition: transform var(--anim-mid) cubic-bezier(0.2, 0.8, 0.2, 1),
                        opacity var(--anim-fast) ease;
        }

        @media (hover: hover) {
            .candy:hover { transform: scale(1.08); filter: brightness(1.05); }
        }

        .candy.red    { background: radial-gradient(circle at 30% 30%, #ff8a80, #d50000); }
        .candy.yellow { background: radial-gradient(circle at 30% 30%, #ffff8d, #fbc02d); }
        .candy.orange { background: radial-gradient(circle at 30% 30%, #ffd180, #f57c00); }
        .candy.purple { background: radial-gradient(circle at 30% 30%, #ea80fc, #aa00ff); }
        .candy.green  { background: radial-gradient(circle at 30% 30%, #b9f6ca, #00c853); }
        .candy.blue   { background: radial-gradient(circle at 30% 30%, #8c9eff, #2962ff); }

        .candy.empty { opacity: 0; pointer-events: none; transform: scale(0.4); }

        .candy.selected {
            transform: scale(1.15); z-index: 2;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 14px 3px rgba(255, 255, 255, 0.7),
                                   inset -5px -5px 12px rgba(0, 0, 0, 0.22),
                                   inset 5px 5px 12px rgba(255, 255, 255, 0.75); }
            50%      { box-shadow: 0 0 28px 10px rgba(255, 255, 255, 1),
                                   inset -5px -5px 12px rgba(0, 0, 0, 0.22),
                                   inset 5px 5px 12px rgba(255, 255, 255, 0.75); }
        }

        .candy.row::after, .candy.col::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 50%; pointer-events: none;
        }
        .candy.row::after { background: repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(255, 255, 255, 0.65) 8px, rgba(255, 255, 255, 0.65) 16px); }
        .candy.col::after { background: repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(255, 255, 255, 0.65) 8px, rgba(255, 255, 255, 0.65) 16px); }

        .candy.bomb { border-radius: 35%; border: 2px dashed rgba(255, 255, 255, 0.8); animation: bombGlow 1.4s ease-in-out infinite; }
        @keyframes bombGlow {
            0%, 100% { box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.3), 0 0 14px rgba(255, 255, 255, 0.8); }
            50%      { box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.3), 0 0 26px rgba(255, 245, 157, 1); }
        }

        .candy.cross { background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red) !important; border: 2px solid white; animation: rainbowSpin 3s linear infinite; }
        @keyframes rainbowSpin { from { filter: hue-rotate(0deg); } to   { filter: hue-rotate(360deg); } }

        #particles { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

        .combo-banner {
            position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
            font-size: 56px; font-weight: 900; color: #fff; text-shadow: 0 4px 20px rgba(216, 27, 96, 0.85);
            pointer-events: none; z-index: 999; opacity: 0;
        }
        .combo-banner.show { animation: comboFloat 1s ease-out forwards; }
        @keyframes comboFloat {
            0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.5); }
            25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            70%  { opacity: 1; transform: translate(-50%, -55%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -85%) scale(0.85); }
        }

        .shake-screen { animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .candy.fresh { animation: spawn var(--anim-slow) cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes spawn { 0% { transform: translateY(-50px) scale(0.4); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

        .candy.clearing { animation: clearPop var(--anim-fast) ease-out forwards; }
        @keyframes clearPop { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.9; } 100% { transform: scale(0.2); opacity: 0; } }

        /* UI Overlay / Modals */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: white; padding: 30px; border-radius: 24px;
            text-align: center; max-width: 90%; width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: translateY(20px); transition: transform 0.3s;
        }
        .overlay.active .modal { transform: translateY(0); }
        
        .modal h2 { margin: 0 0 20px 0; color: #d81b60; font-size: 28px; }
        .modal p { color: #666; font-size: 16px; margin-bottom: 20px; }
        
        .btn {
            background: linear-gradient(135deg, #ff6491, #d81b60);
            color: white; border: none; padding: 12px 20px; margin: 8px 0;
            width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            transition: transform 0.1s, filter 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn:hover { filter: brightness(1.1); }
        .btn-secondary { background: #bbb; box-shadow: none; }

        @media (max-width: 420px) {
            .combo-banner { font-size: 42px; }
            .hud-box span { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-box"><label id="score-label">SCORE</label><span id="score">0</span></div>
        <div class="hud-box" id="hud-center"><label id="center-label">BEST</label><span id="center-val">0</span></div>
        <div class="hud-box"><label id="limit-label">MOVES</label><span id="limit-val">∞</span></div>
    </div>

    <!-- Game Area -->
    <div class="game-container" id="game-container">
        <div class="grid" id="grid"></div>
        <canvas id="particles"></canvas>
    </div>
    <div class="combo-banner" id="comboBanner"></div>

    <!-- Main Menu Overlay -->
    <div id="menu-overlay" class="overlay active">
        <div class="modal">
            <h2>Sweet Candy 🍭</h2>
            <p>選擇你要遊玩的模式</p>
            <button class="btn" onclick="window.game.startMode('ENDLESS')">♾️ 無盡模式</button>
            <button class="btn" onclick="window.game.startMode('TIME')">⏱️ 計時模式 (60秒)</button>
            <button class="btn" onclick="window.game.startMode('STAGE')">🏆 闖關模式</button>
        </div>
    </div>

    <!-- Game Over / Result Overlay -->
    <div id="result-overlay" class="overlay">
        <div class="modal">
            <h2 id="result-title">Game Over</h2>
            <p id="result-desc">Your score: 0</p>
            <button class="btn" id="btn-next" onclick="window.game.nextStage()" style="display: none;">下一關</button>
            <button class="btn" onclick="window.game.restartCurrentMode()">再玩一次</button>
            <button class="btn btn-secondary" onclick="window.game.showMenu()">回主選單</button>
        </div>
    </div>

    <script>
    'use strict';

    // ============================================================
    // Config
    // ============================================================
    const Config = Object.freeze({
        width: 8, height: 8,
        colors: ['red', 'yellow', 'orange', 'purple', 'green', 'blue'],
        colorHex: { red: '#d50000', yellow: '#fbc02d', orange: '#f57c00', purple: '#aa00ff', green: '#00c853', blue: '#2962ff' },
        timing: { swap: 180, clear: 220, drop: 240 },
        scoring: { base: 10, comboBonus: 0.25 },
        particles: { count: 14, spread: 11, gravity: 0.4, decay: 0.04 },
        swipeThreshold: 20,
        bestScoreKey: 'sweetCandy_bestScore_v4'
    });

    const SPECIAL = Object.freeze({ NONE: 'none', ROW: 'row', COL: 'col', BOMB: 'bomb', CROSS: 'cross' });
    const GAME_STATE = Object.freeze({ MENU: 'MENU', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' });

    // ============================================================
    // 關卡設定 (闖關模式) - 難度調低，動態生成 50 關
    // 第一關 500 分，後續每關增加 250 分
    // 開局給 20 步，每 3 關增加 2 步，確保難度平滑且不會卡關
    // ============================================================
    const STAGE_CONFIGS = Array.from({ length: 50 }, (_, i) => ({
        level: i + 1,
        targetScore: 500 + (i * 250),
        moves: 20 + Math.floor(i / 3) * 2 
    }));

    // ============================================================
    // Utils / ParticleEngine / Board / MatchFinder / Renderer
    // ============================================================
    const Utils = {
        delay: ms => new Promise(r => setTimeout(r, ms)),
        randomColor: () => Config.colors[Math.floor(Math.random() * Config.colors.length)],
        randomColorExcept: (...exclude) => {
            const pool = Config.colors.filter(c => !exclude.includes(c));
            return pool[Math.floor(Math.random() * pool.length)];
        },
        inBounds: (r, c) => r >= 0 && r < Config.height && c >= 0 && c < Config.width,
        idx: (r, c) => r * Config.width + c,
        rcOf: i => [Math.floor(i / Config.width), i % Config.width]
    };

    class ParticleEngine {
        constructor(canvas, container) {
            this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.container = container;
            this.particles = []; this.resize();
            window.addEventListener('resize', () => this.resize());
            this._tick = this._tick.bind(this); requestAnimationFrame(this._tick);
        }
        resize() {
            const dpr = window.devicePixelRatio || 1;
            const w = this.container.offsetWidth, h = this.container.offsetHeight;
            this.canvas.width = w * dpr; this.canvas.height = h * dpr;
            this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
            this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        emit(x, y, colorName) {
            const color = Config.colorHex[colorName] || '#ffffff';
            const { count, spread } = Config.particles;
            for (let i = 0; i < count; i++) {
                this.particles.push({
                    x, y, vx: (Math.random() - 0.5) * spread, vy: (Math.random() - 0.5) * spread,
                    life: 1, color, size: Math.random() * 4 + 2
                });
            }
        }
        _tick() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            const { gravity, decay } = Config.particles;
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += gravity; p.life -= decay;
                if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                this.ctx.globalAlpha = p.life; this.ctx.fillStyle = p.color;
                this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); this.ctx.fill();
            }
            this.ctx.globalAlpha = 1; requestAnimationFrame(this._tick);
        }
    }

    class Board {
        constructor() { this.data = new Array(Config.width * Config.height); this.fillNoMatches(); }
        fillNoMatches() {
            for (let r = 0; r < Config.height; r++) {
                for (let c = 0; c < Config.width; c++) {
                    const exclude = [];
                    if (c >= 2) {
                        const a = this.get(r, c - 1), b = this.get(r, c - 2);
                        if (a && b && a.color === b.color) exclude.push(a.color);
                    }
                    if (r >= 2) {
                        const a = this.get(r - 1, c), b = this.get(r - 2, c);
                        if (a && b && a.color === b.color) exclude.push(a.color);
                    }
                    this.set(r, c, this.makeNormal(Utils.randomColorExcept(...exclude)));
                }
            }
        }
        makeNormal(color = Utils.randomColor()) { return { color, special: SPECIAL.NONE, empty: false, fresh: true }; }
        makeEmpty() { return { color: '', special: SPECIAL.NONE, empty: true, fresh: false }; }
        get(r, c) { return Utils.inBounds(r, c) ? this.data[Utils.idx(r, c)] : null; }
        set(r, c, val) { if (Utils.inBounds(r, c)) this.data[Utils.idx(r, c)] = val; }
        swap(r1, c1, r2, c2) {
            const i1 = Utils.idx(r1, c1), i2 = Utils.idx(r2, c2);
            [this.data[i1], this.data[i2]] = [this.data[i2], this.data[i1]];
        }
    }

    class MatchFinder {
        constructor(board) { this.board = board; }
        find() {
            const matched = new Set(); const runs = [];
            // Horizontal
            for (let r = 0; r < Config.height; r++) {
                let runStart = 0;
                for (let c = 1; c <= Config.width; c++) {
                    const prev = this.board.get(r, c - 1), cur = c < Config.width ? this.board.get(r, c) : null;
                    const same = cur && prev && !prev.empty && !cur.empty && cur.color === prev.color;
                    if (!same) {
                        if (c - runStart >= 3 && prev && !prev.empty) {
                            const cells = [];
                            for (let k = runStart; k < c; k++) { cells.push({ r, c: k }); matched.add(Utils.idx(r, k)); }
                            runs.push({ cells, color: prev.color, dir: 'h' });
                        }
                        runStart = c;
                    }
                }
            }
            // Vertical
            for (let c = 0; c < Config.width; c++) {
                let runStart = 0;
                for (let r = 1; r <= Config.height; r++) {
                    const prev = this.board.get(r - 1, c), cur = r < Config.height ? this.board.get(r, c) : null;
                    const same = cur && prev && !prev.empty && !cur.empty && cur.color === prev.color;
                    if (!same) {
                        if (r - runStart >= 3 && prev && !prev.empty) {
                            const cells = [];
                            for (let k = runStart; k < r; k++) { cells.push({ r: k, c }); matched.add(Utils.idx(k, c)); }
                            runs.push({ cells, color: prev.color, dir: 'v' });
                        }
                        runStart = r;
                    }
                }
            }
            return { matched, specials: this._planSpecials(runs) };
        }
        _planSpecials(runs) {
            const specials = []; const used = new Set();
            for (let i = 0; i < runs.length; i++) {
                if (used.has(i)) continue;
                for (let j = i + 1; j < runs.length; j++) {
                    if (used.has(j) || runs[i].dir === runs[j].dir || runs[i].color !== runs[j].color) continue;
                    const intersection = runs[i].cells.find(a => runs[j].cells.some(b => b.r === a.r && b.c === a.c));
                    if (intersection) {
                        specials.push({ r: intersection.r, c: intersection.c, type: SPECIAL.BOMB, color: runs[i].color });
                        used.add(i); used.add(j); break;
                    }
                }
            }
            for (let i = 0; i < runs.length; i++) {
                if (used.has(i)) continue;
                const run = runs[i], len = run.cells.length, mid = run.cells[Math.floor(len / 2)];
                if (len >= 5) specials.push({ r: mid.r, c: mid.c, type: SPECIAL.CROSS, color: run.color });
                else if (len === 4) specials.push({ r: mid.r, c: mid.c, type: run.dir === 'h' ? SPECIAL.COL : SPECIAL.ROW, color: run.color });
            }
            return specials;
        }
    }

    class Renderer {
        constructor(board, gridEl) {
            this.board = board; this.gridEl = gridEl; this.elements = [];
            this.gridEl.innerHTML = '';
            for (let i = 0; i < Config.width * Config.height; i++) {
                const el = document.createElement('div');
                el.className = 'candy'; el.dataset.idx = i;
                this.gridEl.appendChild(el); this.elements.push(el);
            }
        }
        elAt(r, c) { return this.elements[Utils.idx(r, c)]; }
        render({ keepSelected = -1 } = {}) {
            for (let i = 0; i < this.elements.length; i++) {
                const cell = this.board.data[i], el = this.elements[i];
                el.className = 'candy'; el.innerHTML = '';
                if (cell.empty) { el.classList.add('empty'); continue; }
                el.classList.add(cell.color);
                if (cell.special !== SPECIAL.NONE) {
                    el.classList.add(cell.special);
                    if (cell.special === SPECIAL.BOMB) el.innerHTML = '🍬';
                    else if (cell.special === SPECIAL.CROSS) el.innerHTML = '🌈';
                }
                if (cell.fresh) { el.classList.add('fresh'); cell.fresh = false; }
                if (i === keepSelected) el.classList.add('selected');
            }
        }
    }

    // ============================================================
    // Game Controller
    // ============================================================
    class Game {
        constructor() {
            this.board = new Board();
            this.matcher = new MatchFinder(this.board);
            this.gridEl = document.getElementById('grid');
            this.containerEl = document.getElementById('game-container');
            this.renderer = new Renderer(this.board, this.gridEl);
            this.particles = new ParticleEngine(document.getElementById('particles'), this.containerEl);
            
            // HUD Elements
            this.scoreEl = document.getElementById('score');
            this.centerLabel = document.getElementById('center-label');
            this.centerVal = document.getElementById('center-val');
            this.limitLabel = document.getElementById('limit-label');
            this.limitVal = document.getElementById('limit-val');
            this.comboBanner = document.getElementById('comboBanner');

            // Overlays
            this.menuOverlay = document.getElementById('menu-overlay');
            this.resultOverlay = document.getElementById('result-overlay');
            
            // Game State
            this.state = GAME_STATE.MENU;
            this.currentMode = 'ENDLESS';
            this.score = 0;
            this.combo = 0;
            this.isProcessing = false;
            this.selectedIndex = -1;
            
            // Mode variables
            this.timeLeft = 0;
            this.timerInterval = null;
            this.currentStageIdx = 0;
            this.movesLeft = 0;
            this.targetScore = 0;
            
            this.bestScore = parseInt(localStorage.getItem(Config.bestScoreKey), 10) || 0;

            this._bindInputs();
            this.renderer.render();
            this._initialResolve();
        }

        async _initialResolve() {
            const { matched } = this.matcher.find();
            if (matched.size > 0) {
                this.isProcessing = true;
                await this._gameLoop(true);
            }
        }

        // ======================= 模式控制 =======================
        showMenu() {
            this.state = GAME_STATE.MENU;
            this.menuOverlay.classList.add('active');
            this.resultOverlay.classList.remove('active');
            if (this.timerInterval) clearInterval(this.timerInterval);
        }

        startMode(mode) {
            this.currentMode = mode;
            this.menuOverlay.classList.remove('active');
            this.resultOverlay.classList.remove('active');
            if (mode === 'STAGE') {
                this.currentStageIdx = 0;
            }
            this._initLevel();
        }

        restartCurrentMode() {
            this.resultOverlay.classList.remove('active');
            this._initLevel();
        }

        nextStage() {
            this.currentStageIdx++;
            if (this.currentStageIdx >= STAGE_CONFIGS.length) {
                this.currentStageIdx = 0; // 全破回第一關
            }
            this.resultOverlay.classList.remove('active');
            this._initLevel();
        }

        _initLevel() {
            if (this.timerInterval) clearInterval(this.timerInterval);
            
            this.board = new Board();
            this.matcher = new MatchFinder(this.board);
            this.renderer.board = this.board;
            this.score = 0;
            this.combo = 0;
            this.isProcessing = false;
            this.selectedIndex = -1;
            this.state = GAME_STATE.PLAYING;
            
            document.getElementById('btn-next').style.display = 'none';

            if (this.currentMode === 'ENDLESS') {
                this.centerLabel.textContent = 'BEST';
                this.centerVal.textContent = this.bestScore;
                this.limitLabel.textContent = 'MODE';
                this.limitVal.textContent = '∞';
            } else if (this.currentMode === 'TIME') {
                this.timeLeft = 60;
                this.centerLabel.textContent = 'BEST';
                this.centerVal.textContent = this.bestScore;
                this.limitLabel.textContent = 'TIME';
                this.limitVal.textContent = this.timeLeft + 's';
                
                this.timerInterval = setInterval(() => {
                    if (this.state !== GAME_STATE.PLAYING) return;
                    this.timeLeft--;
                    this.limitVal.textContent = this.timeLeft + 's';
                    if (this.timeLeft <= 0) this._endGame(false);
                }, 1000);
            } else if (this.currentMode === 'STAGE') {
                const stage = STAGE_CONFIGS[this.currentStageIdx];
                this.targetScore = stage.targetScore;
                this.movesLeft = stage.moves;
                
                this.centerLabel.textContent = `LV ${stage.level} GOAL`;
                this.centerVal.textContent = this.targetScore;
                this.limitLabel.textContent = 'MOVES';
                this.limitVal.textContent = this.movesLeft;
            }

            this.renderer.render();
            this._updateHUD();
            this._initialResolve();
        }

        _endGame(isWin) {
            this.state = GAME_STATE.GAME_OVER;
            this.isProcessing = true;
            if (this.timerInterval) clearInterval(this.timerInterval);
            
            const titleEl = document.getElementById('result-title');
            const descEl = document.getElementById('result-desc');
            const btnNext = document.getElementById('btn-next');

            if (this.currentMode === 'ENDLESS' || this.currentMode === 'TIME') {
                titleEl.textContent = "Time's Up!"
                descEl.innerHTML = `Final Score: <b>${this.score}</b>`;
            } else if (this.currentMode === 'STAGE') {
                if (isWin) {
                    titleEl.textContent = "Level Cleared! 🎉";
                    descEl.innerHTML = `Score: <b>${this.score}</b> / ${this.targetScore}`;
                    if (this.currentStageIdx < STAGE_CONFIGS.length - 1) {
                        btnNext.style.display = 'inline-block';
                    }
                } else {
                    titleEl.textContent = "Out of Moves! 😢";
                    descEl.innerHTML = `Score: <b>${this.score}</b> (Need ${this.targetScore})`;
                }
            }
            
            setTimeout(() => {
                this.resultOverlay.classList.add('active');
            }, 800);
        }

        _checkWinLossCondition() {
            if (this.state !== GAME_STATE.PLAYING) return;

            if (this.currentMode === 'STAGE') {
                if (this.score >= this.targetScore) {
                    this._endGame(true);
                } else if (this.movesLeft <= 0) {
                    this._endGame(false);
                }
            }
        }

        // ======================= 輸入與核心邏輯 =======================
        _bindInputs() {
            let startX = 0, startY = 0, downIdx = -1;

            this.gridEl.addEventListener('pointerdown', e => {
                if (this.state !== GAME_STATE.PLAYING || this.isProcessing) return;
                const target = e.target.closest('.candy');
                if (!target || target.classList.contains('empty')) return;
                e.preventDefault();
                startX = e.clientX; startY = e.clientY;
                downIdx = parseInt(target.dataset.idx, 10);
            });

            const handleUp = async e => {
                if (downIdx === -1 || this.state !== GAME_STATE.PLAYING || this.isProcessing) { downIdx = -1; return; }
                const idx = downIdx; downIdx = -1;
                const [r, c] = Utils.rcOf(idx);

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const isSwipe = Math.abs(dx) > Config.swipeThreshold || Math.abs(dy) > Config.swipeThreshold;

                if (isSwipe) {
                    this._clearSelection();
                    let r2 = r, c2 = c;
                    if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1;
                    else r2 += dy > 0 ? 1 : -1;
                    if (Utils.inBounds(r2, c2)) await this._attemptSwap(r, c, r2, c2);
                    return;
                }

                if (this.selectedIndex === -1) {
                    this.selectedIndex = idx;
                    this.renderer.elements[idx].classList.add('selected');
                } else if (this.selectedIndex === idx) {
                    const cell = this.board.get(r, c);
                    this._clearSelection();
                    if (cell && cell.special !== SPECIAL.NONE) {
                        this.isProcessing = true;
                        this.combo = 1;
                        await this._consumeMove();
                        await this._detonateAt(r, c);
                        await this._dropCandies();
                        await this._gameLoop();
                    }
                } else {
                    const prev = this.selectedIndex;
                    const [pr, pc] = Utils.rcOf(prev);
                    this._clearSelection();
                    if (Math.abs(pr - r) + Math.abs(pc - c) === 1) {
                        await this._attemptSwap(pr, pc, r, c);
                    } else {
                        this.selectedIndex = idx;
                        this.renderer.elements[idx].classList.add('selected');
                    }
                }
            };
            window.addEventListener('pointerup', handleUp);
            window.addEventListener('pointercancel', () => { downIdx = -1; });
        }

        _clearSelection() {
            if (this.selectedIndex !== -1) {
                this.renderer.elements[this.selectedIndex].classList.remove('selected');
                this.selectedIndex = -1;
            }
        }

        async _consumeMove() {
            if (this.currentMode === 'STAGE' && this.state === GAME_STATE.PLAYING) {
                this.movesLeft--;
                this.limitVal.textContent = this.movesLeft;
            }
        }

        async _attemptSwap(r1, c1, r2, c2) {
            this.isProcessing = true;
            const s1 = this.board.get(r1, c1);
            const s2 = this.board.get(r2, c2);

            this.board.swap(r1, c1, r2, c2);
            this.renderer.render();
            await Utils.delay(Config.timing.swap);

            if (await this._handleSpecialCombo(r1, c1, r2, c2, s1, s2)) {
                await this._consumeMove();
                await this._dropCandies();
                await this._gameLoop();
                return;
            }

            const { matched } = this.matcher.find();
            if (matched.size > 0) {
                await this._consumeMove();
                this.combo = 0;
                await this._gameLoop();
            } else {
                this.board.swap(r1, c1, r2, c2);
                this.renderer.render();
                await Utils.delay(Config.timing.swap);
                this.isProcessing = false;
            }
        }

        // ======================= 特殊糖果邏輯 =======================
        async _handleSpecialCombo(r1, c1, r2, c2, s1, s2) {
            const sp1 = s1.special, sp2 = s2.special;
            const isCross = s => s === SPECIAL.CROSS;
            const isBomb = s => s === SPECIAL.BOMB;
            const isStripe = s => s === SPECIAL.ROW || s === SPECIAL.COL;

            if (isCross(sp1) && isCross(sp2)) {
                this.combo = 1;
                const all = new Set();
                for (let i = 0; i < this.board.data.length; i++) all.add(i);
                await this._clearByIndices(all);
                return true;
            }

            // cross + 任意
            if (isCross(sp1) || isCross(sp2)) {
                this.combo = 1;
                
                const crossPos = isCross(sp1) ? { r: r2, c: c2 } : { r: r1, c: c1 };
                const target = isCross(sp1) ? s2 : s1;
                const targetColor = target.color;

                const indices = new Set();
                const crossIdx = Utils.idx(crossPos.r, crossPos.c);
                
                indices.add(crossIdx);
                this.board.data[crossIdx].special = SPECIAL.NONE;

                for (let i = 0; i < this.board.data.length; i++) {
                    const cell = this.board.data[i];
                    if (cell.empty || cell.color !== targetColor) continue;
                    
                    if (target.special !== SPECIAL.NONE) {
                        let infect = target.special;
                        if (infect === SPECIAL.ROW || infect === SPECIAL.COL) {
                            infect = Math.random() > 0.5 ? SPECIAL.ROW : SPECIAL.COL;
                        }
                        cell.special = infect;
                    }
                    indices.add(i);
                }
                
                await this._clearByIndices(indices);
                return true;
            }

            if (isBomb(sp1) && isBomb(sp2)) {
                this.combo = 1;
                const indices = new Set();
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        if (Utils.inBounds(r2 + dr, c2 + dc)) indices.add(Utils.idx(r2 + dr, c2 + dc));
                    }
                }
                await this._clearByIndices(indices);
                return true;
            }

            if ((isBomb(sp1) && isStripe(sp2)) || (isStripe(sp1) && isBomb(sp2))) {
                this.combo = 1;
                const indices = new Set();
                for (let i = -1; i <= 1; i++) {
                    for (let c = 0; c < Config.width; c++) if (Utils.inBounds(r2 + i, c)) indices.add(Utils.idx(r2 + i, c));
                    for (let r = 0; r < Config.height; r++) if (Utils.inBounds(r, c2 + i)) indices.add(Utils.idx(r, c2 + i));
                }
                await this._clearByIndices(indices);
                return true;
            }

            if (isStripe(sp1) && isStripe(sp2)) {
                this.combo = 1;
                const indices = new Set();
                for (let c = 0; c < Config.width; c++) indices.add(Utils.idx(r2, c));
                for (let r = 0; r < Config.height; r++) indices.add(Utils.idx(r, c2));
                await this._clearByIndices(indices);
                return true;
            }

            return false;
        }

        async _detonateAt(r, c) {
            await this._clearByIndices(new Set([Utils.idx(r, c)]));
        }

        async _clearByIndices(seeds, isInit = false) {
            const toProcess = []; const queued = new Set(); const finalClear = [];
            for (const idx of seeds) { if (!queued.has(idx)) { queued.add(idx); toProcess.push(idx); } }

            const enqueue = (r, c) => {
                if (!Utils.inBounds(r, c)) return;
                const i = Utils.idx(r, c);
                if (queued.has(i)) return;
                const cell = this.board.data[i];
                if (!cell || cell.empty) return;
                queued.add(i); toProcess.push(i);
            };

            const triggers = {
                [SPECIAL.ROW]: (r) => { for (let c = 0; c < Config.width; c++) enqueue(r, c); },
                [SPECIAL.COL]: (_r, c) => { for (let r = 0; r < Config.height; r++) enqueue(r, c); },
                [SPECIAL.BOMB]: (r, c) => {
                    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) enqueue(r + dr, c + dc);
                },
                [SPECIAL.CROSS]: () => {
                    const pool = this.board.data.filter(c => !c.empty && c.special !== SPECIAL.CROSS);
                    if (pool.length === 0) return;
                    const target = pool[Math.floor(Math.random() * pool.length)].color;
                    for (let i = 0; i < this.board.data.length; i++) {
                        if (this.board.data[i].color === target) {
                            const [r, c] = Utils.rcOf(i); enqueue(r, c);
                        }
                    }
                }
            };

            while (toProcess.length > 0) {
                const idx = toProcess.shift();
                const cell = this.board.data[idx];
                if (!cell || cell.empty) continue;
                const [r, c] = Utils.rcOf(idx);
                finalClear.push({ r, c, color: cell.color, special: cell.special });

                if (cell.special !== SPECIAL.NONE && triggers[cell.special]) triggers[cell.special](r, c);
                cell.empty = true;
            }

            if (finalClear.length === 0) return;

            if (!isInit) {
                const multiplier = 1 + Math.max(0, this.combo - 1) * Config.scoring.comboBonus;
                const gained = Math.floor(finalClear.length * Config.scoring.base * multiplier);
                this.score += gained;

                const conRect = this.containerEl.getBoundingClientRect();
                for (const t of finalClear) {
                    const el = this.renderer.elAt(t.r, t.c);
                    const rect = el.getBoundingClientRect();
                    this.particles.emit(rect.left - conRect.left + rect.width / 2, rect.top - conRect.top + rect.height / 2, t.color);
                    el.classList.add('clearing');
                }

                if (finalClear.length > 5 || this.combo > 1) {
                    this.containerEl.classList.add('shake-screen');
                    setTimeout(() => this.containerEl.classList.remove('shake-screen'), 300);
                    if (this.combo > 1) {
                        this.comboBanner.textContent = `Combo ${this.combo}!`;
                        this.comboBanner.classList.remove('show');
                        void this.comboBanner.offsetWidth;
                        this.comboBanner.classList.add('show');
                    }
                }

                this._updateHUD();
                await Utils.delay(Config.timing.clear);
            }

            for (const t of finalClear) this.board.set(t.r, t.c, this.board.makeEmpty());
            this.renderer.render();
        }

        async _dropCandies() {
            let moved = false;
            for (let c = 0; c < Config.width; c++) {
                let writeR = Config.height - 1;
                for (let readR = Config.height - 1; readR >= 0; readR--) {
                    const cell = this.board.get(readR, c);
                    if (!cell.empty) {
                        if (writeR !== readR) {
                            this.board.set(writeR, c, { ...cell, fresh: true });
                            this.board.set(readR, c, this.board.makeEmpty());
                            moved = true;
                        }
                        writeR--;
                    }
                }
                while (writeR >= 0) {
                    this.board.set(writeR, c, this.board.makeNormal());
                    writeR--; moved = true;
                }
            }
            this.renderer.render();
            if (moved) await Utils.delay(Config.timing.drop);
        }

        async _gameLoop(isInit = false) {
            while (true) {
                const { matched, specials } = this.matcher.find();
                if (matched.size === 0) break;
                
                if (!isInit) {
                    this.combo++;
                }

                const indicesToClear = new Set(matched);
                const reservedSpawns = [];
                for (const sp of specials) {
                    const idx = Utils.idx(sp.r, sp.c);
                    if (indicesToClear.has(idx)) {
                        indicesToClear.delete(idx);
                        reservedSpawns.push(sp);
                    }
                }

                await this._clearByIndices(indicesToClear, isInit);

                for (const sp of reservedSpawns) {
                    this.board.set(sp.r, sp.c, { color: sp.color, special: sp.type, empty: false, fresh: true });
                }
                this.renderer.render();

                await this._dropCandies();
            }
            
            if (!isInit) {
                this.combo = 0;
                this._checkWinLossCondition();
            }
            this.isProcessing = false;
        }

        _updateHUD() {
            this.scoreEl.textContent = this.score;
            this.scoreEl.classList.remove('bump');
            void this.scoreEl.offsetWidth;
            this.scoreEl.classList.add('bump');

            if ((this.currentMode === 'ENDLESS' || this.currentMode === 'TIME') && this.score > this.bestScore) {
                this.bestScore = this.score;
                this.centerVal.textContent = this.bestScore;
                try { localStorage.setItem(Config.bestScoreKey, String(this.bestScore)); } catch (_) {}
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.game = new Game();
    });
    </script>
</body>
