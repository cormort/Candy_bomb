<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍬 Candy Blast 🍭</title>
<style>
:root {
  --board-size: 8;
  --cell-size: 46px;
  --gap: 6px;
  --board-padding: 12px;
  --bg-blur: 60px;
  --anim-fast: 120ms;
  --anim-mid: 180ms;
  --anim-slow: 300ms;
  --bg-grad: radial-gradient(120% 120% at 50% 0%, #3a1d5c 0%, #241040 55%, #160a2b 100%);
  --blob1: rgba(255, 92, 138, 0.40);
  --blob2: rgba(94, 234, 212, 0.26);
  --accent: #ff5c8a;
  --accent-2: #ff8fb3;
  --gold: #ffd36b;
  --surface: rgba(255,255,255,0.055);
  --surface-strong: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.13);
  --text: #fff;
  --muted: rgba(255,255,255,0.58);
  --radius-gem: 30%;
}
@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 400 700; font-display: swap; src: local('Fredoka'), local('Fredoka-Regular'), local('Fredoka-Bold'); }
@media (max-width: 460px) {
  :root {
    --cell-size: calc((100vw - 36px - var(--board-padding) * 2 - var(--gap) * (var(--board-size) - 1)) / var(--board-size));
    --bg-blur: 28px;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; align-items: center;
  background: var(--bg-grad); background-attachment: fixed;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  margin: 0; padding: 18px 12px 28px; min-height: 100vh;
  touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden; position: relative;
  transition: background 0.8s ease;
}
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%; filter: blur(var(--bg-blur));
  z-index: 0; pointer-events: none; animation: float 11s ease-in-out infinite;
  transition: background 0.8s ease;
}
body::before { width: 380px; height: 380px; background: radial-gradient(circle, var(--blob1), transparent 70%); top: -120px; left: -120px; }
body::after { width: 340px; height: 340px; background: radial-gradient(circle, var(--blob2), transparent 70%); bottom: -110px; right: -120px; animation-delay: -3s; }
@keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(34px,-26px) scale(1.08); } }

.app-shell { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; z-index: 5; position: relative; }

.top-bar { display: flex; gap: 8px; justify-content: flex-end; align-items: center; width: 100%; margin-bottom: 10px; z-index: 10; position: relative; }
.brand-mini { margin-right: auto; display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }
.brand-mini .dot { font-size: 19px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
.toggle-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px 12px; font-family: inherit; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
  backdrop-filter: blur(8px); transition: transform .12s ease, background .2s; white-space: nowrap;
}
.toggle-btn:active { transform: scale(0.92); }
.toggle-btn.off { opacity: 0.5; }
.toggle-btn.pause-btn { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-color: transparent; box-shadow: 0 6px 16px rgba(255,92,138,.35); }

.hud { display: flex; justify-content: space-between; gap: 10px; width: 100%; margin-bottom: 16px; z-index: 10; }
.hud-box {
  flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 12px; border-radius: 18px;
  text-align: center; display: flex; flex-direction: column; gap: 2px; justify-content: center; min-width: 0;
  backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.hud-box label { font-size: 10px; color: var(--muted); letter-spacing: 1.4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.hud-box span { font-size: 26px; font-weight: 700; line-height: 1.05; transition: transform var(--anim-fast); display: inline-block; }
.hud-box span.bump { transform: scale(1.28); }
.hud-box.score-box span { color: var(--gold); }

.game-container { position: relative; z-index: 5; margin-bottom: 16px; }
.game-container.processing { cursor: wait; }
.game-container.processing .grid { filter: brightness(0.96) saturate(0.94); }
.grid {
  display: grid; grid-template-columns: repeat(var(--board-size), var(--cell-size)); grid-template-rows: repeat(var(--board-size), var(--cell-size));
  gap: var(--gap); background: rgba(0,0,0,0.26); padding: var(--board-padding); border-radius: 26px;
  border: 1px solid var(--border);
  box-shadow: 0 30px 70px rgba(0,0,0,0.45), inset 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  transition: filter 0.18s ease;
}
.cell-bg { border-radius: 26%; background: rgba(255,255,255,0.035); box-shadow: inset 0 2px 5px rgba(0,0,0,0.25); }

.candy {
  width: 100%; height: 100%; border-radius: var(--radius-gem); display: flex; align-items: center; justify-content: center;
  font-size: 23px; cursor: pointer; position: relative;
  box-shadow: inset 0 -5px 9px rgba(0,0,0,0.30), inset 0 4px 7px rgba(255,255,255,0.45), 0 4px 9px rgba(0,0,0,0.32);
  will-change: transform, opacity; transition: transform var(--anim-mid) cubic-bezier(0.2,0.8,0.2,1), opacity var(--anim-fast) ease;
}
.candy::before {
  content: ''; position: absolute; top: 13%; left: 17%; width: 44%; height: 36%; border-radius: 50%;
  background: linear-gradient(160deg, rgba(255,255,255,0.92), rgba(255,255,255,0) 75%); pointer-events: none;
}
@media (hover: hover) { .candy:hover { transform: scale(1.07); filter: brightness(1.06); } }

.candy.red    { background: radial-gradient(circle at 32% 26%, #ff97a4, #ff5d6c 42%, #c8203f); }
.candy.yellow { background: radial-gradient(circle at 32% 26%, #fff0a8, #ffce4d 45%, #e69a12); }
.candy.orange { background: radial-gradient(circle at 32% 26%, #ffc28a, #ff8f3c 45%, #e2640f); }
.candy.purple { background: radial-gradient(circle at 32% 26%, #e0b3ff, #b06bff 45%, #7c2ff0); }
.candy.green  { background: radial-gradient(circle at 32% 26%, #b4f7d4, #4fdd97 45%, #11a566); }
.candy.blue   { background: radial-gradient(circle at 32% 26%, #b3ccff, #5e95ff 45%, #2456e6); }
.candy.empty  { opacity: 0; pointer-events: none; transform: scale(0.4); }
.candy.empty::before { display: none; }

.candy.selected { transform: scale(1.16); z-index: 2; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 14px 3px rgba(255,255,255,0.75); } 50% { box-shadow: 0 0 30px 11px rgba(255,255,255,1); } }
.candy.row::after, .candy.col::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius-gem); pointer-events: none; }
.candy.row::after { background: repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(255,255,255,0.7) 7px, rgba(255,255,255,0.7) 14px); }
.candy.col::after { background: repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(255,255,255,0.7) 7px, rgba(255,255,255,0.7) 14px); }
.candy.bomb { border-radius: 24%; border: 2px dashed rgba(255,255,255,0.85); animation: bombGlow 1.4s ease-in-out infinite; }
@keyframes bombGlow { 0%,100% { box-shadow: 0 0 14px rgba(255,255,255,0.8); } 50% { box-shadow: 0 0 28px rgba(255,211,107,1); } }
.candy.rainbow, .candy.cross { background: conic-gradient(#ff5d6c, #ffce4d, #4fdd97, #5e95ff, #b06bff, #ff5d6c) !important; border: 2px solid #fff; animation: rainbowSpin 2.4s linear infinite; }
@keyframes rainbowSpin { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

#particles { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

.combo-banner { position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%); font-size: 56px; font-weight: 700; color: #fff; text-shadow: 0 4px 22px rgba(255,92,138,0.85); pointer-events: none; z-index: 999; opacity: 0; }
.combo-banner.show { animation: comboFloat 1s ease-out forwards; }
@keyframes comboFloat { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.5); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); } 70% { opacity: 1; transform: translate(-50%,-55%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-85%) scale(0.85); } }
.combo-banner.tier-2 { color: #ff8fb3; } .combo-banner.tier-3 { color: #ffce4d; } .combo-banner.tier-4 { color: #ff7043; }
.combo-banner.tier-5 { color: #c47bff; text-shadow: 0 4px 22px rgba(170,0,255,0.9); }
.combo-banner.tier-6 { color: var(--gold); text-shadow: 0 0 32px gold, 0 4px 22px rgba(255,211,107,0.95); font-size: 68px; }

.milestone-banner { position: fixed; top: 32%; left: 50%; transform: translate(-50%,-50%); font-size: 58px; font-weight: 700; color: var(--gold); text-shadow: 0 0 32px #ff9100, 0 4px 22px rgba(0,0,0,0.5); pointer-events: none; z-index: 1500; opacity: 0; white-space: nowrap; }
.milestone-banner.show { animation: milestoneShow 1.8s ease-out forwards; }
@keyframes milestoneShow { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(-12deg); } 18% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(4deg); } 32% { transform: translate(-50%,-50%) scale(1) rotate(0); } 100% { opacity: 0; transform: translate(-50%,-130%) scale(1.4); } }

.candy.hint { animation: hintPulse 0.75s ease-in-out infinite; z-index: 3; }
@keyframes hintPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); box-shadow: inset 0 -5px 9px rgba(0,0,0,0.3), inset 0 4px 7px rgba(255,255,255,0.45), 0 0 22px 6px rgba(255,235,59,0.95); } }
.candy.hint-bounce { animation: hintBounce 0.4s ease-in-out 3; }
@keyframes hintBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
.shake-screen { animation: shake 0.3s ease-in-out; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.candy.falling { transition: none !important; }
.candy.fresh { animation: spawn var(--anim-slow) cubic-bezier(0.34,1.56,0.64,1); }
@keyframes spawn { 0% { transform: translateY(-54px) scale(0.4); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
.candy.clearing { animation: clearPop var(--anim-fast) ease-out forwards; }
@keyframes clearPop { 0% { transform: scale(1) rotate(0); filter: brightness(1); opacity: 1; } 50% { transform: scale(1.3) rotate(15deg); filter: brightness(2); opacity: 0.9; } 100% { transform: scale(0) rotate(45deg); opacity: 0; } }
.candy.shake { animation: cellShake 0.25s ease-in-out; }
@keyframes cellShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.hud-box.goal-close { animation: goalPulse 1s ease-in-out infinite; }
@keyframes goalPulse { 0%,100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.08); } 50% { box-shadow: 0 0 26px rgba(255,211,107,0.7); } }

.fx-flash-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; animation: flashAnim 0.5s ease-out forwards; }
@keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
.fx-floating-text { position: fixed; color: #fff; font-size: 34px; font-weight: 700; text-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px #ffd36b; transform: translate(-50%,-50%); pointer-events: none; z-index: 9999; animation: floatText 1.2s ease-out forwards; }
@keyframes floatText { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%,-60%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%,-150%) scale(1.5); } }
.fx-shuffle-out .candy { animation: shuffOut 0.25s forwards; }
.fx-shuffle-in .candy { animation: shuffIn 0.25s forwards; }
@keyframes shuffOut { to { transform: scale(0) rotate(180deg); opacity: 0; } }
@keyframes shuffIn { from { transform: scale(0) rotate(-180deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

body.disable-fx::before, body.disable-fx::after { display: none !important; }
body.disable-fx canvas#particles { display: none !important; }
body.disable-fx .candy.selected { animation: none !important; box-shadow: 0 0 10px #fff !important; transform: scale(1.1); }
body.disable-fx .candy.bomb { animation: none !important; }
body.disable-fx .candy.cross, body.disable-fx .candy.rainbow { animation: none !important; filter: none !important; }
body.disable-fx .shake-screen { animation: none !important; transform: none !important; }
body.disable-fx .candy.fresh, body.disable-fx .candy.clearing { animation: none !important; }
body.disable-fx .candy { transition: none !important; }
body.disable-fx .candy.hint { animation: none !important; }

.inventory-container, .shop-container { display: none; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px; backdrop-filter: blur(8px); z-index: 10; margin-bottom: 12px; }
.inventory-container.active, .shop-container.active { display: block; }
.panel-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.panel-title b { color: var(--gold); }
.item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.action-btn { background: var(--surface-strong); border: 1px solid var(--border); border-radius: 14px; padding: 9px 3px; font-family: inherit; font-size: 11px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: opacity .15s, filter .15s, transform .1s, background .15s; position: relative; color: #fff; }
.action-btn:active:not(:disabled) { transform: scale(0.9); }
.action-btn:not(:disabled):hover { background: rgba(255,255,255,0.16); }
.action-btn:disabled { opacity: 0.42; filter: grayscale(0.5); cursor: not-allowed; }
.action-btn span.name { font-weight: 600; }
.action-btn span.badge { position: absolute; top: -7px; right: -7px; background: var(--accent); color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.action-btn span.cost { color: var(--gold); font-weight: 700; font-size: 10px; }
.action-btn.trade-btn:disabled span.cost { color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(10,4,22,0.66); backdrop-filter: blur(7px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px; }
.overlay.active { opacity: 1; pointer-events: auto; }
.modal { background: linear-gradient(180deg, #2e1850, #1f1038); border: 1px solid var(--border); padding: 26px 24px; border-radius: 26px; text-align: center; max-width: 92%; width: 340px; box-shadow: 0 30px 70px rgba(0,0,0,0.55); transform: translateY(22px) scale(0.97); transition: transform 0.3s; max-height: 92vh; overflow-y: auto; }
.overlay.active .modal { transform: translateY(0) scale(1); }
.modal h2 { margin: 0 0 6px; font-size: 30px; font-weight: 700; }
.modal .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.brand-big { font-size: 38px; font-weight: 700; margin: 4px 0 2px; background: linear-gradient(135deg, #ff8fb3, #ffd36b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand-emoji { font-size: 46px; display: block; margin-bottom: 2px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }

.btn { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border: none; padding: 14px 20px; margin: 7px 0; width: 100%; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, box-shadow .2s; box-shadow: 0 8px 20px rgba(255,92,138,.30); }
.btn:active { transform: scale(0.97); }
.btn .b-sub { display: block; font-size: 11px; font-weight: 500; opacity: 0.85; margin-top: 1px; }
.btn.resume-btn { background: linear-gradient(135deg, #66e0a0, #18b878); box-shadow: 0 8px 20px rgba(24,184,120,.3); }
.btn.ghost { background: var(--surface-strong); box-shadow: none; border: 1px solid var(--border); }
.btn.gold { background: linear-gradient(135deg, #ffe08a, #ffb33c); color: #5a3500; box-shadow: 0 8px 20px rgba(255,179,60,.3); }

.diff-row { display: flex; gap: 6px; margin: 4px 0 14px; }
.diff-btn { flex: 1; background: var(--surface-strong); border: 1px solid var(--border); color: var(--muted); border-radius: 12px; padding: 9px 4px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: .15s; }
.diff-btn.active { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(255,92,138,.3); }
.diff-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: left; margin: 2px 2px 4px; font-weight: 600; }

.menu-stats-line { color: var(--muted); font-size: 13px; margin: 2px 0 16px; display: flex; gap: 16px; justify-content: center; }
.menu-stats-line b { color: var(--gold); }

.reward-bonus { background: linear-gradient(135deg, rgba(255,211,107,.16), rgba(255,143,60,.16)); border: 1px solid rgba(255,211,107,.4); padding: 14px; border-radius: 16px; margin: 0 0 14px; animation: bonusReveal 0.6s cubic-bezier(0.34,1.56,0.64,1); }
.reward-bonus .bonus-label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 6px; font-weight: 700; letter-spacing: 1.5px; }
.reward-bonus b { font-size: 17px; color: #fff; display: block; }
.reward-bonus small { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; }
@keyframes bonusReveal { 0% { transform: scale(0.5) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.reward-next-hint { color: var(--muted); font-size: 13px; margin: 8px 0 6px; }
.star-display { margin: 6px 0 14px; display: flex; justify-content: center; gap: 12px; font-size: 40px; }
.star-display span { animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards; display: inline-block; }
.star-display span:nth-child(2) { animation-delay: 0.15s; } .star-display span:nth-child(3) { animation-delay: 0.3s; }
.star-display span.empty { filter: grayscale(1); opacity: 0.22; }
@keyframes starPop { 0% { transform: scale(0.3) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.new-best-badge { display: none; background: linear-gradient(135deg, var(--gold), #ff9100); color: #5a3500; padding: 8px 16px; border-radius: 20px; font-weight: 700; margin: 0 0 12px; letter-spacing: 1px; font-size: 14px; }
.new-best-badge.show { display: inline-block; animation: badgeBump 0.6s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes badgeBump { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

.ach-list { display: flex; flex-direction: column; gap: 9px; margin: 4px 0 14px; text-align: left; }
.ach-card { display: flex; align-items: center; gap: 12px; background: var(--surface-strong); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; transition: .2s; }
.ach-card.done { background: linear-gradient(135deg, rgba(255,211,107,.14), rgba(255,143,60,.1)); border-color: rgba(255,211,107,.4); }
.ach-card .ico { font-size: 26px; width: 30px; text-align: center; filter: grayscale(1) opacity(0.5); }
.ach-card.done .ico { filter: none; }
.ach-card .meta { flex: 1; min-width: 0; }
.ach-card .meta .nm { font-weight: 600; font-size: 14px; }
.ach-card .meta .ds { font-size: 11.5px; color: var(--muted); }
.ach-card .prog { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.ach-card.done .prog { color: var(--gold); }
.ach-bar { height: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-top: 5px; overflow: hidden; }
.ach-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 4px; transition: width .4s ease; }
.ach-card.done .ach-bar > i { background: linear-gradient(90deg, var(--gold), #ff9100); }

.ach-toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%,-130%); z-index: 2000; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #2e1850, #3a1d5c); border: 1px solid rgba(255,211,107,.5); border-radius: 18px; padding: 12px 18px 12px 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); pointer-events: none; max-width: 90vw; }
.ach-toast.show { animation: achToast 3.4s cubic-bezier(0.2,0.9,0.2,1) forwards; }
@keyframes achToast { 0% { transform: translate(-50%,-130%); } 10% { transform: translate(-50%,0); } 88% { transform: translate(-50%,0); } 100% { transform: translate(-50%,-130%); } }
.ach-toast .ico { font-size: 32px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
.ach-toast .txt .lbl { font-size: 10px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
.ach-toast .txt .nm { font-size: 16px; font-weight: 600; }
</style>

<body>

<div class="app-shell">

class AudioEngine {
  constructor() {
    this.ctx = null; this.master = null;
    this.muted = (() => { try { return localStorage.getItem(Config.soundMutedKey) === '1'; } catch (_) { return false; } })();
    this.bgmTimer = null; this._bgmActive = false; this._currentTrack = 0;
    this._hapticEnabled = (navigator.vibrate !== undefined);
  }
  vibrate(pattern) { if (this._hapticEnabled && !this.muted) navigator.vibrate(pattern); }
  _ensure() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      this.ctx = new Ctx();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  }
  _tone(freq, dur, type = 'sine', vol = 0.3, attack = 0.005) {
    if (this.muted || !this._ensure()) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.05);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  }
  _glide(f1, f2, dur, type = 'sine', vol = 0.3) {
    if (this.muted || !this._ensure()) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.05);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  }
  click() { this._tone(880, 0.04, 'square', 0.08); }
  swap() { this._glide(420, 620, 0.1, 'triangle', 0.18); }
  match() { this._glide(720, 1080, 0.14, 'triangle', 0.2); }
  combo(n) { const base = 600 + Math.min(n - 1, 8) * 70; for (let i = 0; i < 3; i++) setTimeout(() => this._tone(base + i * 130, 0.09, 'triangle', 0.22), i * 55); }
  special() { this._glide(1000, 1800, 0.18, 'sine', 0.18); setTimeout(() => this._tone(2200, 0.06, 'sine', 0.14), 90); }
  explode() { this._glide(380, 60, 0.32, 'sawtooth', 0.26); }
  levelClear() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => this._tone(f, 0.22, 'triangle', 0.24), i * 90)); }
  gameOver() { [392, 349.23, 311.13, 261.63].forEach((f, i) => setTimeout(() => this._tone(f, 0.28, 'sawtooth', 0.22), i * 140)); }
  trade() { this._glide(700, 1000, 0.13, 'sine', 0.2); setTimeout(() => this._tone(1300, 0.06, 'sine', 0.17), 70); }
  fail() { this._tone(180, 0.18, 'square', 0.16); }
  startBGM(trackIndex = 0) {
    if (this.muted || this._bgmActive) return;
    if (!this._ensure()) return;
    this._currentTrack = ((trackIndex % BGM_TRACKS.length) + BGM_TRACKS.length) % BGM_TRACKS.length;
    this._bgmActive = true;
    let i = 0;
    const playNext = () => {
      if (!this._bgmActive || this.muted) { this._bgmActive = false; this.bgmTimer = null; return; }
      const melody = BGM_TRACKS[this._currentTrack].melody;
      const note = melody[i % melody.length];
      this._tone(note.f, note.d * 0.92, 'sine', 0.06, 0.04);
      if (note.bass) this._tone(note.bass, note.d * 1.4, 'triangle', 0.045, 0.03);
      i++;
      this.bgmTimer = setTimeout(playNext, note.d * 1000);
    };
    playNext();
  }
  switchTrack(trackIndex) {
    const target = ((trackIndex % BGM_TRACKS.length) + BGM_TRACKS.length) % BGM_TRACKS.length;
    if (this._currentTrack === target && this._bgmActive) return;
    this.stopBGM(); this.startBGM(target);
  }
  stopBGM() { this._bgmActive = false; if (this.bgmTimer) { clearTimeout(this.bgmTimer); this.bgmTimer = null; } }
  toggleMute() {
    this.muted = !this.muted;
    try { localStorage.setItem(Config.soundMutedKey, this.muted ? '1' : '0'); } catch (_) {}
    if (this.muted) this.stopBGM();
    return this.muted;
  }
}

class ParticleEngine {
  constructor(canvas, container) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.container = container;
    this._pool = []; this.activeParticles = []; this._rafId = null; this._poolSize = 150;
    this.resize(); window.addEventListener('resize', () => this.resize());
    // free-list of pool indices: acquire/park in O(1) instead of linear find(!active)
    this._free = [];
    for (let i = 0; i < this._poolSize; i++) this._free.push(i);
    for (let i = 0; i < this._poolSize; i++) this._pool.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, color: '#fff', size: 2, active: false });
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = this.container.offsetWidth, h = this.container.offsetHeight;
    this.canvas.width = w * dpr; this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  _ensureLoop() { if (!this._rafId) this._tick(); }
  _tick() {
    this._rafId = null;
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    if (this.activeParticles.length > 0) {
      const { gravity, decay } = Config.particles;
      for (let i = this.activeParticles.length - 1; i >= 0; i--) {
        const p = this._pool[this.activeParticles[i]]; p.x += p.vx; p.y += p.vy; p.vy += gravity; p.life -= decay;
        if (p.life <= 0) { p.active = false; this._free.push(this.activeParticles[i]); this.activeParticles.splice(i, 1); continue; }
        this.ctx.globalAlpha = p.life; this.ctx.fillStyle = p.color;
        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); this.ctx.fill();
      }
      this.ctx.globalAlpha = 1;
      this._rafId = requestAnimationFrame(() => this._tick());
    }
  }
  emit(x, y, colorName) {
    if (window.game && !window.game.fxEnabled) return;
    const color = Config.colorHex[colorName] || colorName;
    const { count, spread } = Config.particles;
    for (let i = 0; i < count; i++) {
      let idx = this._free.pop();
      if (idx === undefined) { this._pool.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, color: '#fff', size: 2, active: false }); idx = this._pool.length - 1; }
      const p = this._pool[idx];
      p.x = x; p.y = y; p.vx = (Math.random() - 0.5) * spread; p.vy = (Math.random() - 0.5) * spread;
      p.life = 1; p.color = color; p.size = Math.random() * 4 + 2; p.active = true;
      this.activeParticles.push(idx);
    }
    this._ensureLoop();
  }
}

class Board {
  constructor() { this.data = new Array(Config.width * Config.height); this.fillNoMatches(); }
  fillNoMatches() {
    for (let r = 0; r < Config.height; r++) {
      for (let c = 0; c < Config.width; c++) {
        const exclude = [];
        if (c >= 2) { const a = this.get(r, c - 1), b = this.get(r, c - 2); if (a && b && a.color === b.color) exclude.push(a.color); }
        if (r >= 2) { const a = this.get(r - 1, c), b = this.get(r - 2, c); if (a && b && a.color === b.color) exclude.push(a.color); }
        this.set(r, c, this.makeNormal(Utils.randomColorExcept(...exclude)));
      }
    }
  }
  makeNormal(color = Utils.randomColor()) { return { color, special: SPECIAL.NONE, empty: false, fresh: true }; }
  makeEmpty() { return { color: '', special: SPECIAL.NONE, empty: true, fresh: false }; }
  get(r, c) { return Utils.inBounds(r, c) ? this.data[Utils.idx(r, c)] : null; }
  set(r, c, val) { if (Utils.inBounds(r, c)) this.data[Utils.idx(r, c)] = val; }
  swap(r1, c1, r2, c2) { const i1 = Utils.idx(r1, c1), i2 = Utils.idx(r2, c2); [this.data[i1], this.data[i2]] = [this.data[i2], this.data[i1]]; }
}

class MatchFinder {
  constructor(board) { this.board = board; }
  find(swapPositions = null) {
    const matched = new Set(); const runs = [];
    for (let r = 0; r < Config.height; r++) {
      let runStart = 0;
      for (let c = 1; c <= Config.width; c++) {
        const prev = this.board.get(r, c - 1), cur = c < Config.width ? this.board.get(r, c) : null;
        const same = cur && prev && !prev.empty && !cur.empty && cur.color === prev.color;
        if (!same) {
          if (c - runStart >= 3 && prev && !prev.empty) {
            const cells = []; for (let k = runStart; k < c; k++) { cells.push({ r, c: k }); matched.add(Utils.idx(r, k)); }
            runs.push({ cells, color: prev.color, dir: 'h' });
          }
          runStart = c;
        }
      }
    }
    for (let c = 0; c < Config.width; c++) {
      let runStart = 0;
      for (let r = 1; r <= Config.height; r++) {
        const prev = this.board.get(r - 1, c), cur = r < Config.height ? this.board.get(r, c) : null;
        const same = cur && prev && !prev.empty && !cur.empty && cur.color === prev.color;
        if (!same) {
          if (r - runStart >= 3 && prev && !prev.empty) {
            const cells = []; for (let k = runStart; k < r; k++) { cells.push({ r: k, c }); matched.add(Utils.idx(k, c)); }
            runs.push({ cells, color: prev.color, dir: 'v' });
          }
          runStart = r;
        }
      }
    }
    return { matched, specials: this._planSpecials(runs, swapPositions) };
  }
  _planSpecials(runs, swapPositions = null) {
    const specials = []; const used = new Set();
    for (let i = 0; i < runs.length; i++) {
      if (used.has(i)) continue;
      for (let j = i + 1; j < runs.length; j++) {
        if (used.has(j) || runs[i].dir === runs[j].dir || runs[i].color !== runs[j].color) continue;
        const intersection = runs[i].cells.find(a => runs[j].cells.some(b => b.r === a.r && b.c === a.c));
        if (intersection) { specials.push({ r: intersection.r, c: intersection.c, type: SPECIAL.BOMB, color: runs[i].color }); used.add(i); used.add(j); break; }
      }
    }
    for (let i = 0; i < runs.length; i++) {
      if (used.has(i)) continue;
      const run = runs[i], len = run.cells.length;
      let spawnPos = null;
      if (swapPositions) spawnPos = run.cells.find(cell => swapPositions.some(sp => sp.r === cell.r && sp.c === cell.c));
      if (!spawnPos) spawnPos = run.cells[Math.floor(len / 2)];
      if (len >= 5) specials.push({ r: spawnPos.r, c: spawnPos.c, type: SPECIAL.CROSS, color: run.color });
      else if (len === 4) specials.push({ r: spawnPos.r, c: spawnPos.c, type: run.dir === 'h' ? SPECIAL.COL : SPECIAL.ROW, color: run.color });
    }
    return specials;
  }
}

class Renderer {
  constructor(board, gridEl) {
    this.board = board; this.gridEl = gridEl; this.elements = [];
    this.gridEl.innerHTML = '';
    for (let i = 0; i < Config.width * Config.height; i++) {
      const el = document.createElement('div'); el.className = 'candy'; el.dataset.idx = i;
      this.gridEl.appendChild(el); this.elements.push(el);
    }
    this._glowPhase = 0; this._glowRafId = null;
    this._specialEls = []; this._stride = 0;
    this._updateStride();
    window.addEventListener('resize', () => this._updateStride());
  }
  _updateStride() {
    // row stride = cell-size + gap; cached because cell-size is responsive (media query)
    const cs = getComputedStyle(this.gridEl);
    this._stride = parseFloat(cs.gridTemplateRows) + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 0);
  }
  elAt(r, c) { return this.elements[Utils.idx(r, c)]; }
  _startGlowAnimation() {
    const animate = () => {
      this._glowPhase = (this._glowPhase + 0.05) % (Math.PI * 2);
      const intensity = (Math.sin(this._glowPhase) + 1) / 2;
      for (const el of this._specialEls) {
        el.style.boxShadow = `inset 0 -5px 9px rgba(0,0,0,0.30), inset 0 4px 7px rgba(255,255,255,0.45), 0 0 ${8 + intensity * 12}px ${2 + intensity * 4}px rgba(255,255,255,${0.5 + intensity * 0.5})`;
      }
      if (this._specialEls.length > 0) this._glowRafId = requestAnimationFrame(animate);
      else this._glowRafId = null; // idle: no special candies on board, stop the loop
    };
    animate();
  }
  stopGlowAnimation() { if (this._glowRafId) { cancelAnimationFrame(this._glowRafId); this._glowRafId = null; } }
  render({ keepSelected = -1 } = {}) {
    const falling = [];
    this._specialEls = [];
    for (let i = 0; i < this.elements.length; i++) {
      const cell = this.board.data[i], el = this.elements[i];
      el.className = 'candy'; el.innerHTML = ''; el.style.boxShadow = ''; el.style.transform = '';
      if (cell.empty) { el.classList.add('empty'); continue; }
      el.classList.add(cell.color);
      if (cell.special !== SPECIAL.NONE) {
        el.classList.add(cell.special);
        if (cell.special === SPECIAL.BOMB) el.innerHTML = '🍬';
        else if (cell.special === SPECIAL.CROSS) el.innerHTML = '🌟';
        this._specialEls.push(el);
      }
      if (cell.fall) { el.classList.add('falling'); el.style.transform = `translateY(${-cell.fall * this._stride}px)`; falling.push(el); cell.fall = 0; }
      else if (cell.fresh) { el.classList.add('fresh'); cell.fresh = false; }
      if (i === keepSelected) el.classList.add('selected');
    }
    if (falling.length) {
      void this.gridEl.offsetHeight; // force reflow so the start transform applies before transitioning
      requestAnimationFrame(() => { for (const el of falling) { el.classList.remove('falling'); el.style.transform = ''; } });
    }
    if (!this._glowRafId && this._specialEls.length > 0) this._startGlowAnimation();
  }
}

class Game {

    this.tradeMovesPool = 0;

    this.scoreEl = document.getElementById('score'); this.centerLabel = document.getElementById('center-label');
    this.centerVal = document.getElementById('center-val'); this.limitLabel = document.getElementById('limit-label');

    this.timeLeft = 0; this.timerInterval = null; this.currentStageLevel = 1;
    this.movesLeft = 0; this.targetScore = 0;

    this.bestScore = parseInt(localStorage.getItem(Config.bestScoreKey), 10) || 0;

    this.totalStars = parseInt(localStorage.getItem(Config.totalStarsKey), 10) || 0;
    this._bgmStartOffset = 0;
    this._hintTimer = null; this._currentHint = null;

    this.milestoneBanner = document.getElementById('milestoneBanner');
    this.menuTotalStarsEl = document.getElementById('menu-total-stars');
    this.menuBestEl = document.getElementById('menu-best');

    this.difficulty = (() => { try { return localStorage.getItem(Config.diffKey) || 'NORMAL'; } catch (_) { return 'NORMAL'; } })();
    if (!DIFFICULTY[this.difficulty]) this.difficulty = 'NORMAL';
    this.stats = this._loadStats();
    this.unlocked = this._loadUnlocked();
    this._syncDifficultyUI();
    this._syncMenuStars();

    this._setupLeaveGuard(); this._bindInputs(); this._bindGlobalClickSfx();
    this._syncSoundButton();
    this.renderer.render(); this._initialResolve();
  }

  get isProcessing() { return this._isProcessing; }
  set isProcessing(v) {
    this._isProcessing = v;
    if (this.containerEl) this.containerEl.classList.toggle('processing', !!v);
    if (this.tradeBtns) this._updateTradeUI();
  }

  _loadStats() {
    const def = { matches: 0, candies: 0, specials: 0, maxCombo: 0, maxLevel: 0, maxScore: 0, totalStars: this.totalStars };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(Config.statsKey) || '{}')); } catch (_) { return def; }
  }
  _saveStats() { try { localStorage.setItem(Config.statsKey, JSON.stringify(this.stats)); } catch (_) {} }
  _loadUnlocked() { try { return new Set(JSON.parse(localStorage.getItem(Config.achKey) || '[]')); } catch (_) { return new Set(); } }
  _saveUnlocked() { try { localStorage.setItem(Config.achKey, JSON.stringify([...this.unlocked])); } catch (_) {} }
  _bumpStat(key, value, mode = 'add') {
    if (mode === 'max') { if (value > (this.stats[key] || 0)) this.stats[key] = value; else return; }
    else this.stats[key] = (this.stats[key] || 0) + value;
    this._saveStats(); this._checkAchievements();
  }
  _checkAchievements() {
    for (const a of ACHIEVEMENTS) {
      if (this.unlocked.has(a.id)) continue;
      if ((this.stats[a.stat] || 0) >= a.goal) {
        this.unlocked.add(a.id); this._saveUnlocked(); this._showAchToast(a);
      }
    }
  }
  _showAchToast(a) {
    const toast = document.getElementById('ach-toast');
    document.getElementById('ach-toast-ico').textContent = a.icon;
    document.getElementById('ach-toast-name').textContent = a.name;
    toast.classList.remove('show'); Utils.reflow(toast); toast.classList.add('show');
    setTimeout(() => this.audio.levelClear(), 120);
  }
  openAchievements() {
    const list = document.getElementById('ach-list');
    list.innerHTML = '';
    for (const a of ACHIEVEMENTS) {
      const cur = Math.min(this.stats[a.stat] || 0, a.goal);
      const done = this.unlocked.has(a.id);
      const pct = Math.round(cur / a.goal * 100);
      const card = document.createElement('div');
      card.className = 'ach-card' + (done ? ' done' : '');
      card.innerHTML = `<span class="ico">${a.icon}</span><div class="meta"><div class="nm">${a.name}</div><div class="ds">${a.desc}</div><div class="ach-bar"><i style="width:${pct}%"></i></div></div><span class="prog">${done ? '✓ 完成' : cur + '/' + a.goal}</span>`;
      list.appendChild(card);
    }
    document.getElementById('ach-summary').textContent = `已解鎖 ${this.unlocked.size} / ${ACHIEVEMENTS.length}`;
    this.achOverlay.classList.add('active');
  }
  closeAchievements() { this.achOverlay.classList.remove('active'); }

  setDifficulty(d) {
    if (!DIFFICULTY[d]) return;
    this.difficulty = d;
    try { localStorage.setItem(Config.diffKey, d); } catch (_) {}
    this._syncDifficultyUI();
    this.audio.click();
  }
  _syncDifficultyUI() {
    document.querySelectorAll('#diff-row .diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === this.difficulty));
  }
  get _diffMoves() { return DIFFICULTY[this.difficulty].moves; }
  get _diffMult() { return DIFFICULTY[this.difficulty].mult; }

  toggleFX() {
    this.fxEnabled = !this.fxEnabled;
    const btn = document.getElementById('btn-fx-toggle');
    if (this.fxEnabled) { document.body.classList.remove('disable-fx'); btn.textContent = '✨'; btn.classList.remove('off'); }
    else { document.body.classList.add('disable-fx'); btn.textContent = '✨'; btn.classList.add('off'); }
  }
  toggleSound() {
    const muted = this.audio.toggleMute();
    this._syncSoundButton();
    if (!muted && this.state === GAME_STATE.PLAYING) this.audio.startBGM(this._bgmTrackForCurrentMode());
  }
  _bgmTrackForLevel(level) { const cycle = Math.floor((Math.max(level, 1) - 1) / BGM_TRACK_PER_STAGES); return (this._bgmStartOffset + cycle) % BGM_TRACKS.length; }
  _bgmTrackForCurrentMode() { return this.currentMode === 'STAGE' ? this._bgmTrackForLevel(this.currentStageLevel) : this._bgmStartOffset; }

  _resetHintTimer() {
    this._clearHintVisual();
    if (this._hintTimer) clearTimeout(this._hintTimer);
    this._hintTimer = null;
    if (this.state !== GAME_STATE.PLAYING) return;
    this._hintTimer = setTimeout(() => this._tryShowHint(), Config.hintIdleMs);
  }
  _killHint() { this._clearHintVisual(); if (this._hintTimer) { clearTimeout(this._hintTimer); this._hintTimer = null; } }
  _clearHintVisual() {
    if (!this._currentHint) return;
    const [r1, c1, r2, c2] = this._currentHint;
    const e1 = this.renderer.elAt(r1, c1), e2 = this.renderer.elAt(r2, c2);
    if (e1) e1.classList.remove('hint'); if (e2) e2.classList.remove('hint');
    this._currentHint = null;
  }
  _tryShowHint() {
    if (this.state !== GAME_STATE.PLAYING) return;
    if (this._isProcessing) { this._hintTimer = setTimeout(() => this._tryShowHint(), 1500); return; }
    const move = this._findPossibleMove();
    if (move) {
      const [r1, c1, r2, c2] = move;
      const el1 = this.renderer.elAt(r1, c1), el2 = this.renderer.elAt(r2, c2);
      el1?.classList.add('hint'); el2?.classList.add('hint'); this._currentHint = move;
      setTimeout(() => {
        if (this._currentHint === move && this.state === GAME_STATE.PLAYING) {
          el1?.classList.add('hint-bounce'); el2?.classList.add('hint-bounce');
          setTimeout(() => { el1?.classList.remove('hint-bounce'); el2?.classList.remove('hint-bounce'); }, 1200);
        }
      }, 3000);
    } else { this.isProcessing = true; this._executePropEffect('SHUFFLE'); }
  }
  _findPossibleMove() {
    for (let r = 0; r < Config.height; r++) {
      for (let c = 0; c < Config.width; c++) {
        if (c + 1 < Config.width) {
          this.board.swap(r, c, r, c + 1);
          const hasMatch = this.matcher.find().matched.size > 0;
          this.board.swap(r, c, r, c + 1);
          if (hasMatch) return [r, c, r, c + 1];
        }
        if (r + 1 < Config.height) {
          this.board.swap(r, c, r + 1, c);
          const hasMatch = this.matcher.find().matched.size > 0;
          this.board.swap(r, c, r + 1, c);
          if (hasMatch) return [r, c, r + 1, c];
        }
      }
    }
    return null;
  }

  _comboLabel(n) { return COMBO_LABELS[Math.min(n, COMBO_LABELS.length - 1)] || 'LEGENDARY!'; }
  _comboTier(n) { return Math.min(n, 6); }
  _checkMilestone() {
    if (this.currentMode !== 'ENDLESS' && this.currentMode !== 'TIME') return;
    for (let i = 0; i < Config.endlessMilestones.length; i++) {
      if (this.score >= Config.endlessMilestones[i] && i > this._lastMilestoneIdx) {
        this._lastMilestoneIdx = i; this._triggerMilestone(Config.endlessMilestones[i]); break;
      }
    }
  }
  _triggerMilestone(value) {
    this.milestoneBanner.textContent = `🎉 ${value.toLocaleString()}!`;
    this.milestoneBanner.classList.remove('show'); Utils.reflow(this.milestoneBanner); this.milestoneBanner.classList.add('show');
    this.audio.levelClear(); this._playFxFlash('rgba(255,211,107,0.4)');
  }

  _calcStars(score, target) {
    if (target <= 0) return 3;
    const ratio = score / target;
    if (ratio >= 2.0) return 3;
    if (ratio >= 1.4) return 2;
    return 1;
  }
  _commitStars(stars) {
    this.totalStars += stars;
    try { localStorage.setItem(Config.totalStarsKey, String(this.totalStars)); } catch (_) {}
    this._bumpStat('totalStars', this.totalStars, 'max');
    this._syncMenuStars();
  }
  _syncMenuStars() {
    if (this.menuTotalStarsEl) this.menuTotalStarsEl.textContent = this.totalStars;
    if (this.menuBestEl) this.menuBestEl.textContent = this.bestScore;
  }
  _renderRewardStars(stars) {
    const el = document.getElementById('reward-stars'); el.innerHTML = '';
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); s.textContent = '⭐'; if (i >= stars) s.classList.add('empty'); el.appendChild(s); }
  }
  _targetScoreForLevel(level) { return Math.floor((500 + 400 * Math.log2(level)) * this._diffMult); }
  _applyTheme(level) {
    const t = Themes[((level - 1) % Themes.length + Themes.length) % Themes.length];
    const root = document.documentElement;
    root.style.setProperty('--bg-grad', t.bg); root.style.setProperty('--blob1', t.blob1); root.style.setProperty('--blob2', t.blob2);
  }
  _syncSoundButton() {
    const btn = document.getElementById('btn-sound-toggle');
    if (this.audio.muted) { btn.textContent = '🔇'; btn.classList.add('off'); }
    else { btn.textContent = '🔊'; btn.classList.remove('off'); }
  }
  _bindGlobalClickSfx() {
    document.addEventListener('click', e => { const tgt = e.target.closest('button:not(:disabled)'); if (tgt) this.audio.click(); }, true);
  }
  async _playFxFloatingText(text, targetEl) {
    if (!this.fxEnabled) return;
    const el = document.createElement('div'); el.className = 'fx-floating-text'; el.textContent = text;
    const rect = targetEl.getBoundingClientRect();
    el.style.left = `${rect.left + rect.width / 2}px`; el.style.top = `${rect.top}px`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
  }
  async _playFxFlash(color = 'rgba(255,255,255,0.8)') {

    const overlay = document.createElement('div'); overlay.className = 'fx-flash-overlay'; overlay.style.background = color;
    document.body.appendChild(overlay); setTimeout(() => overlay.remove(), 500);
  }
  _setupLeaveGuard() { window.addEventListener('beforeunload', (e) => { if (this.state === GAME_STATE.PLAYING || this.state === GAME_STATE.REWARD) { e.preventDefault(); e.returnValue = ''; } }); }
  async _initialResolve() { const { matched } = this.matcher.find(); if (matched.size > 0) { this.isProcessing = true; await this._gameLoop(true); } }

  showMenu() {
    this.state = GAME_STATE.MENU; this.menuOverlay.classList.add('active'); this.resultOverlay.classList.remove('active');
    this.tradePost.classList.remove('active'); this.inventoryPanel.classList.remove('active');
    this.pauseBtn.style.display = 'none'; this.resumeBtn.style.display = 'none';
    this.resultBestBadge.classList.remove('show');
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
    this.audio.stopBGM(); this._applyTheme(1); this._killHint(); this._syncMenuStars();
  }

  async _triggerBombAt(r, c) { this._clearSelection(); this.isProcessing = true; this.combo = 1; this._consumeMove(); await this._detonateAt(r, c); await this._dropCandies(); await this._gameLoop(); }

  _bindInputs() {
    let startX = 0, startY = 0, downIdx = -1, startTime = 0, lastTapIdx = -1, lastTapTime = 0;
    this.gridEl.addEventListener('pointerdown', e => {
      if (this.state !== GAME_STATE.PLAYING || this.isProcessing) return;
      const target = e.target.closest('.candy'); if (!target || target.classList.contains('empty')) return;
      e.preventDefault(); startX = e.clientX; startY = e.clientY; startTime = Date.now(); downIdx = parseInt(target.dataset.idx, 10);
      this._resetHintTimer();
    });
    const handleUp = async e => {
      if (downIdx === -1 || this.state !== GAME_STATE.PLAYING || this.isProcessing) { downIdx = -1; return; }
      const idx = downIdx; downIdx = -1; const [r, c] = Utils.rcOf(idx);
      const dx = e.clientX - startX, dy = e.clientY - startY, duration = Date.now() - startTime;
      let isSwipe = Math.abs(dx) > Config.swipeThreshold || Math.abs(dy) > Config.swipeThreshold;
      if (duration < 250 && Math.max(Math.abs(dx), Math.abs(dy)) < 35) isSwipe = false;
      if (isSwipe) {
        this._clearSelection(); let r2 = r, c2 = c;
        if (Math.abs(dx) > Math.abs(dy)) c2 += dx > 0 ? 1 : -1; else r2 += dy > 0 ? 1 : -1;
        if (Utils.inBounds(r2, c2)) await this._attemptSwap(r, c, r2, c2); return;
      }
      const now = Date.now(), isDoubleTap = (idx === lastTapIdx && (now - lastTapTime) < 400);
      lastTapIdx = idx; lastTapTime = now; const cell = this.board.get(r, c);
      if (this.selectedIndex === idx || isDoubleTap) { this._clearSelection(); if (cell && cell.special !== SPECIAL.NONE) await this._triggerBombAt(r, c); }
      else {
        const prev = this.selectedIndex; this._clearSelection();
        if (prev !== -1) { const [pr, pc] = Utils.rcOf(prev); if (Math.abs(pr - r) + Math.abs(pc - c) === 1) { await this._attemptSwap(pr, pc, r, c); return; } }
        this.selectedIndex = idx; this.renderer.render({ keepSelected: idx });
      }
    };
    window.addEventListener('pointerup', handleUp); window.addEventListener('pointercancel', () => { downIdx = -1; });
  }
  _clearSelection() { if (this.selectedIndex !== -1) { this.selectedIndex = -1; this.renderer.render(); } }
  _consumeMove(amount = 1) {

  }
  async _attemptSwap(r1, c1, r2, c2) {

    this.isProcessing = true; const s1 = this.board.get(r1, c1), s2 = this.board.get(r2, c2);
    this.audio.swap(); this.audio.vibrate(10);
    this.board.swap(r1, c1, r2, c2); this.renderer.render(); await Utils.delay(Config.timing.swap);
    const swapPos = [{ r: r1, c: c1 }, { r: r2, c: c2 }];
    if (await this._handleSpecialCombo(r1, c1, r2, c2, s1, s2)) { this._consumeMove(); await this._dropCandies(); await this._gameLoop(); return; }
    const { matched } = this.matcher.find(swapPos);
    if (matched.size > 0) { this._consumeMove(); this.combo = 0; await this._gameLoop(false, swapPos); }
    else {
      this.board.swap(r1, c1, r2, c2); this.renderer.render(); await Utils.delay(Config.timing.swap);
      this.audio.fail(); this.audio.vibrate(30);
      const el1 = this.renderer.elAt(r1, c1), el2 = this.renderer.elAt(r2, c2);
      el1?.classList.add('shake'); el2?.classList.add('shake');
      setTimeout(() => { el1?.classList.remove('shake'); el2?.classList.remove('shake'); }, 250);
      this.isProcessing = false; this._resetHintTimer();
    }
  }
  async _handleSpecialCombo(r1, c1, r2, c2, s1, s2) {
    const sp1 = s1.special, sp2 = s2.special;
    const isCross = s => s === SPECIAL.CROSS, isBomb = s => s === SPECIAL.BOMB, isStripe = s => s === SPECIAL.ROW || s === SPECIAL.COL;
    if (isCross(sp1) && isCross(sp2)) return this._comboCrossCross();
    if (isCross(sp1) || isCross(sp2)) return this._comboCrossWithX(r1, c1, r2, c2, s1, s2, isCross);
    if (isBomb(sp1) && isBomb(sp2)) return this._comboBombBomb(r1, c1, r2, c2);
    if ((isBomb(sp1) && isStripe(sp2)) || (isStripe(sp1) && isBomb(sp2))) return this._comboBombStripe(r1, c1, r2, c2);
    if (isStripe(sp1) && isStripe(sp2)) return this._comboStripeStripe(r1, c1, r2, c2);
    return false;
  }
  async _comboCrossWithX(r1, c1, r2, c2, s1, s2, isCross) {
    this.combo = 1; this.audio.special(); this.audio.vibrate(80);
    const s1IsCross = isCross(s1.special);
    const crossR = s1IsCross ? r2 : r1, crossC = s1IsCross ? c2 : c1;
    const partnerR = s1IsCross ? r1 : r2, partnerC = s1IsCross ? c1 : c2;
    const partner = s1IsCross ? s2 : s1;
    if (partner.special !== SPECIAL.NONE) return this._comboCrossSpecial(crossR, crossC, partnerR, partnerC, partner);
    return this._comboCrossNormal(crossR, crossC, partner.color);
  }
  async _comboCrossCross() {
    this.combo = 1; this.audio.special(); this.audio.vibrate(120);
    const indices = new Set(); for (let i = 0; i < this.board.data.length; i++) { if (!this.board.data[i].empty) indices.add(i); }
    await this._clearByIndices(indices); return true;
  }
  async _comboCrossNormal(crossR, crossC, targetColor) {
    const indices = new Set(); indices.add(Utils.idx(crossR, crossC));
    for (let i = 0; i < this.board.data.length; i++) { if (this.board.data[i].empty || this.board.data[i].color !== targetColor) continue; indices.add(i); }
    await this._clearByIndices(indices); return true;
  }
  async _comboCrossSpecial(crossR, crossC, partnerR, partnerC, partner) {
    const crossIdx = Utils.idx(crossR, crossC), partnerIdx = Utils.idx(partnerR, partnerC);
    const targetColor = partner.color; let partnerSpecial = partner.special;
    for (let i = 0; i < this.board.data.length; i++) {
      const cell = this.board.data[i];
      if (cell.empty || cell.color !== targetColor) continue;
      if (i === crossIdx || i === partnerIdx) continue;
      let infect = partnerSpecial;
      if (infect === SPECIAL.ROW || infect === SPECIAL.COL) infect = Math.random() > 0.5 ? SPECIAL.ROW : SPECIAL.COL;
      cell.special = infect;
    }
    this.board.data[crossIdx].special = SPECIAL.NONE; this.board.data[partnerIdx].special = SPECIAL.NONE;
    this.renderer.render(); await this._clearByIndices(new Set([crossIdx, partnerIdx])); return true;
  }
  async _comboBombBomb(r1, c1, r2, c2) {
    this.combo = 1; this.audio.explode(); this.audio.vibrate(150);
    const mr = Math.round((r1 + r2) / 2), mc = Math.round((c1 + c2) / 2);
    const indices = new Set();
    for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) if (Math.abs(dr) + Math.abs(dc) <= 4 && Utils.inBounds(mr + dr, mc + dc)) indices.add(Utils.idx(mr + dr, mc + dc));
    await this._clearByIndices(indices); return true;
  }
  async _comboBombStripe(r1, c1, r2, c2) {
    this.combo = 1; this.audio.explode(); this.audio.vibrate(100);
    const mr = Math.round((r1 + r2) / 2), mc = Math.round((c1 + c2) / 2);
    const indices = new Set();
    for (let i = -1; i <= 1; i++) { for (let c = 0; c < Config.width; c++) if (Utils.inBounds(mr + i, c)) indices.add(Utils.idx(mr + i, c)); for (let r = 0; r < Config.height; r++) if (Utils.inBounds(r, mc + i)) indices.add(Utils.idx(r, mc + i)); }
    await this._clearByIndices(indices); return true;
  }
  async _comboStripeStripe(r1, c1, r2, c2) {
    this.combo = 1; this.audio.explode(); this.audio.vibrate(100);
    const mr = Math.round((r1 + r2) / 2), mc = Math.round((c1 + c2) / 2);
    const indices = new Set();
    for (let c = 0; c < Config.width; c++) indices.add(Utils.idx(mr, c));
    for (let r = 0; r < Config.height; r++) indices.add(Utils.idx(r, mc));
    await this._clearByIndices(indices); return true;
  }
  async _detonateAt(r, c) { this.combo = 1; this.audio.explode(); this.audio.vibrate(150); await this._clearByIndices(new Set([Utils.idx(r, c)])); }

  async _clearByIndices(seeds, isInit = false) {
    const toProcess = [], queued = new Set(), finalClear = [];
    for (const idx of seeds) { if (!queued.has(idx)) { queued.add(idx); toProcess.push(idx); } }
    const enqueue = (r, c) => {
      if (!Utils.inBounds(r, c)) return; const i = Utils.idx(r, c);
      if (queued.has(i)) return; const cell = this.board.data[i];
      if (!cell || cell.empty) return; queued.add(i); toProcess.push(i);
    };
    const triggers = {
      [SPECIAL.ROW]: (r) => { for (let c = 0; c < Config.width; c++) enqueue(r, c); },
      [SPECIAL.COL]: (_r, c) => { for (let r = 0; r < Config.height; r++) enqueue(r, c); },
      [SPECIAL.BOMB]: (r, c) => { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) enqueue(r + dr, c + dc); },
      [SPECIAL.CROSS]: () => {
        const pool = this.board.data.filter(c => !c.empty && c.special !== SPECIAL.CROSS);
        if (pool.length === 0) { for (let i = 0; i < this.board.data.length; i++) if (this.board.data[i].special === SPECIAL.CROSS) enqueue(...Utils.rcOf(i)); return; }
        const target = pool[Math.floor(Math.random() * pool.length)].color;
        for (let i = 0; i < this.board.data.length; i++) if (this.board.data[i].color === target) enqueue(...Utils.rcOf(i));
      }
    };
    while (toProcess.length > 0) {
      const idx = toProcess.shift(); const cell = this.board.data[idx];
      if (!cell || cell.empty) continue; const [r, c] = Utils.rcOf(idx);
      finalClear.push({ r, c, color: cell.color, special: cell.special });
      if (cell.special !== SPECIAL.NONE && triggers[cell.special]) triggers[cell.special](r, c);
      cell.empty = true;
    }
    if (finalClear.length === 0) return;
    if (!isInit) {
      const multiplier = (1 + Math.max(0, this.combo - 1) * Config.scoring.comboBonus) * (this._doubleScoreActive > 0 ? 2 : 1);
      if (this._doubleScoreActive > 0) this._doubleScoreActive--;
      this.score += Math.floor(finalClear.length * Config.scoring.base * multiplier);
      this._bumpStat('candies', finalClear.length);
      const conRect = this.containerEl.getBoundingClientRect();
      for (const t of finalClear) {
        const el = this.renderer.elAt(t.r, t.c), rect = el.getBoundingClientRect();
        this.particles.emit(rect.left - conRect.left + rect.width / 2, rect.top - conRect.top + rect.height / 2, t.color);
        el.classList.add('clearing');
      }
      if (this.combo > 1) { this.audio.combo(this.combo); this.audio.vibrate(50); } else { this.audio.match(); }
      if (finalClear.length > 5 || this.combo > 1) {
        if (this.fxEnabled) {
          this.containerEl.classList.add('shake-screen'); setTimeout(() => this.containerEl.classList.remove('shake-screen'), 300);
          if (this.combo > 1) { this.comboBanner.textContent = this._comboLabel(this.combo); this.comboBanner.className = `combo-banner tier-${this._comboTier(this.combo)}`; Utils.reflow(this.comboBanner); this.comboBanner.classList.add('show'); }
        }
      }
      this._updateHUD(); await Utils.delay(Config.timing.clear);
    }
    for (const t of finalClear) this.board.set(t.r, t.c, this.board.makeEmpty());
    this.renderer.render();
  }
  async _dropCandies() {
    let moved = false;
    for (let c = 0; c < Config.width; c++) {
      let writeR = Config.height - 1;
      for (let readR = Config.height - 1; readR >= 0; readR--) {
        const cell = this.board.get(readR, c);
        if (!cell.empty) { if (writeR !== readR) { this.board.set(writeR, c, { ...cell, fresh: false, fall: writeR - readR }); this.board.set(readR, c, this.board.makeEmpty()); moved = true; } writeR--; }
      }
      while (writeR >= 0) { this.board.set(writeR, c, { ...this.board.makeNormal(), fresh: false, fall: writeR + 1 }); writeR--; moved = true; }
    }
    this.renderer.render(); if (moved) await Utils.delay(Config.timing.drop);
  }
  async _gameLoop(isInit = false, swapPositions = null) {
    while (true) {
      const { matched, specials } = this.matcher.find(swapPositions); swapPositions = null; if (matched.size === 0) break; if (!isInit) this.combo++;
      if (!isInit) { this._bumpStat('matches', 1); this._bumpStat('maxCombo', this.combo, 'max'); }
      const indicesToClear = new Set(matched), reservedSpawns = [];
      for (const sp of specials) { const idx = Utils.idx(sp.r, sp.c); if (indicesToClear.has(idx)) { indicesToClear.delete(idx); reservedSpawns.push(sp); } }
      await this._clearByIndices(indicesToClear, isInit);
      if (reservedSpawns.length > 0 && !isInit) { this.audio.special(); this._bumpStat('specials', reservedSpawns.length); }
      for (const sp of reservedSpawns) this.board.set(sp.r, sp.c, { color: sp.color, special: sp.type, empty: false, fresh: true });
      this.renderer.render(); await this._dropCandies();
    }
    if (!isInit) { this.combo = 0; this._checkWinLossCondition(); }
    if (this.state === GAME_STATE.PLAYING) { this.isProcessing = false; this._resetHintTimer(); }
  }
  _updateHUD() {
    this.scoreEl.textContent = this.score;
    this.tradePoolEl.textContent = this.tradeMovesPool;
    this.tradePoolEl.style.color = this.tradeMovesPool >= Config.maxTradePool ? '#ffb33c' : '';
    this.tradePoolEl.title = `上限 ${Config.maxTradePool} 步`;
    this._updateTradeUI();
    if (this.fxEnabled) { this.scoreEl.classList.remove('bump'); Utils.reflow(this.scoreEl); this.scoreEl.classList.add('bump'); }
    const hudCenter = document.getElementById('hud-center');
    if (this.currentMode === 'STAGE' && this.targetScore > 0) {
      const goalRatio = this.score / this.targetScore;
      if (goalRatio >= 0.8) { hudCenter.classList.add('goal-close'); this.centerVal.style.color = 'var(--gold)'; this.centerVal.style.textShadow = '0 0 6px #ff9100'; }
      else { hudCenter.classList.remove('goal-close'); this.centerVal.style.color = ''; this.centerVal.style.textShadow = ''; }
    } else { hudCenter.classList.remove('goal-close'); }
    if ((this.currentMode === 'ENDLESS' || this.currentMode === 'TIME') && this.score > this.bestScore) {
      this.bestScore = this.score; this.centerVal.textContent = this.bestScore; try { localStorage.setItem(Config.bestScoreKey, String(this.bestScore)); } catch (_) {}
    }
    this._bumpStat('maxScore', this.score, 'max');
    this._checkMilestone();
  }
}

window.game = new Game();
</script>
